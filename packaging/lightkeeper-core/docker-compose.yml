services:
  lightkeeper-core:
    image: ghcr.io/kalaksi/lightkeeper-core
    restart: unless-stopped
    # Container UID/GID must match the account Lightkeeper clients use to connect to this host,
    # so that account can access core.sock.
    user: "1000:1000"
    cap_drop:
      - ALL
    # environment:
    #   RUST_LOG: debug
    volumes:
      # Lightkeeper configuration, SSH keys, known_hosts, and possible secrets.key (for secret store).
      - ./config:/config
      # When using a container, set "Socket path" in Lightkeeper's core connection dialog to
      # the absolute host path, e.g. /example/lightkeeper-core/data/core.sock.
      # Data, secrets.enc, and the unix socket (core.sock).
      - ./data:/data
