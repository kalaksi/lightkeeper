services:
  lightkeeper-core:
    image: ghcr.io/kalaksi/lightkeeper-core
    restart: unless-stopped
    # Container UID/GID must match the account Lightkeeper clients use to connect to this host,
    # so that account can access core.sock.
    user: "1000:1000"
    cap_drop:
      - ALL
    # environment:
    #   RUST_LOG: debug
    volumes:
      - ./config:/config
      # Data and the unix socket (core.sock). For Docker, set Socket path in the
      # core connection dialog to the absolute host path, e.g. /.../data/core.sock.
      - ./data:/data
