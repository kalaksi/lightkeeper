name: Build Debian 14 package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-debian-package:
    name: Build Debian 14 package
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    container:
      # debian:forky
      image: debian:forky@sha256:a46c047e81bbede575434a5bd8e94bdeee49a605fc652e1f275fc03c94a4aaea

    steps:
      - name: Install build dependencies
        run: |
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "5";' \
            >/etc/apt/apt.conf.d/99github-actions.conf
          apt-get update
          apt-get install -y \
            git ca-certificates \
            gcc g++ make \
            rustc cargo \
            qt6-base-dev qt6-declarative-dev \
            libdbus-1-dev liboping-dev libssl-dev \
            perl debhelper devscripts dpkg-dev
          rustc --version

      - name: Checkout repository
        # actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust workspace for Git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve version
        id: version
        run: |
          VERSION=$(./packaging/scripts/version.sh)
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARBALLDIR="packaging/debian/tarballs"
          BUILDDIR="packaging/debian/build"
          ./packaging/debian/scripts/build-binary.sh "${VERSION}" "${TARBALLDIR}" "${BUILDDIR}"

          mkdir -p artifacts/deb
          cp -a "${BUILDDIR}"/*.deb artifacts/deb/
          rm -f artifacts/deb/*-dbgsym_*.deb artifacts/deb/*-dbg_*.deb
          cp -a "${BUILDDIR}"/*.changes artifacts/deb/ || true
          cp -a "${BUILDDIR}"/*.buildinfo artifacts/deb/ || true

      - name: Attest .deb provenance
        # actions/attest@v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/deb/*.deb

      - name: Upload .deb artifacts
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: debian-deb
          path: artifacts/deb/*
