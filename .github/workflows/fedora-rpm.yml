name: Build Fedora packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fedora-package:
    name: Build Fedora ${{ matrix.fedora }} package
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora: "43"
            image: fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222
          - fedora: "44"
            image: fedora:44@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install dependencies
        run: |
          dnf -y install \
            bash \
            cargo \
            gcc \
            gcc-c++ \
            git \
            make \
            perl-File-Compare \
            perl-File-Copy \
            perl-FindBin \
            perl-IPC-Cmd \
            perl-Time-Piece \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            dbus-devel \
            liboping-devel \
            rpm-build \
            rpmdevtools

      - name: Checkout repository
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust workspace for Git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPMs
        run: |
          VERSION="$(packaging/scripts/version.sh)"
          packaging/fedora/scripts/build-binary.sh "${VERSION}" "packaging/fedora/build" "packaging/fedora/tarballs"

      - name: Collect artifact list
        id: collect_artifacts
        run: |
          mapfile -t files < <(packaging/fedora/scripts/list-artifacts.sh "packaging/fedora/build")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No RPM artifacts found" >&2
            exit 1
          fi

          printf "%s\n" "${files[@]}"

      - name: Attest RPM provenance
        # actions/attest@v4
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: packaging/fedora/build/RPMS/**/*.rpm

      - name: Upload workflow artifacts
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fedora-${{ matrix.fedora }}-rpms
          path: packaging/fedora/build/RPMS/**/*.rpm
          if-no-files-found: error
